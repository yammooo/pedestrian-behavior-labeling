[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pedestrian-behavior-labeling"
version = "0.0.0"
description = "Research workspace for pedestrian behavior annotation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
inspection = ["Pillow>=10"]
waymo-inspection = ["Pillow>=10", "numpy>=1.24,<3", "pyarrow>=12"]

[tool.setuptools.packages.find]
where = ["src"]
